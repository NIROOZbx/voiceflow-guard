services:
  test-postgres:
    image: postgres:18-alpine
    container_name: voiceflow_guard_test_db
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-voiceflow_guard_test}
    ports:
      - "${TEST_POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_POSTGRES_USER:-postgres} -d ${TEST_POSTGRES_DB:-voiceflow_guard_test}"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s
